<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Portmonka — Auth Spike</title>
  <style>
    :root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#e5e7eb;background:#0b1020}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;box-sizing:border-box}
    main{width:min(680px,100%);background:#111827;border:1px solid #263244;border-radius:20px;padding:24px;box-sizing:border-box}
    h1{margin:0 0 8px;font-size:28px}.muted{color:#9ca3af;line-height:1.5}
    button{width:100%;margin-top:12px;padding:14px 16px;border:0;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer}
    #popupBtn{background:#f3f4f6;color:#111827}#redirectBtn{background:#374151;color:#fff}
    #signOutBtn{background:#7f1d1d;color:#fff}.status{margin-top:20px;padding:16px;border-radius:12px;background:#0b1220;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,monospace;font-size:13px}
    .ok{color:#86efac}.err{color:#fca5a5}.warn{color:#fde68a}
    .small{font-size:12px;color:#6b7280;margin-top:14px}
  </style>
</head>
<body>
<main>
  <h1>Portmonka — Auth Spike</h1>
  <p class="muted">Izolovaný test: Android + Opera → Google → Firebase Authentication.</p>
  <button id="popupBtn">1. Přihlásit přes Google (popup)</button>
  <button id="redirectBtn">2. Přihlásit přes Google (redirect)</button>
  <button id="signOutBtn">Odhlásit</button>
  <div id="status" class="status">Inicializuji Firebase…</div>
  <div class="small">Toto není produkční aplikace. Testuje pouze autentizaci.</div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    signInWithRedirect,
    getRedirectResult,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAw4mg8uBLX5RKw0qponSyGEacwiExt40kI",
    authDomain: "portmonka-951967.firebaseapp.com",
    projectId: "portmonka-951967",
    storageBucket: "portmonka-951967.firebasestorage.app",
    messagingSenderId: "723477690356",
    appId: "1:723477690356:web:261e152b2da52251b2ba1"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();
  const status = document.getElementById("status");

  function show(message, kind = "") {
    status.className = `status ${kind}`;
    status.textContent = message;
  }

  function describeError(error) {
    return [
      `code: ${error?.code || "neznámý"}`,
      `message: ${error?.message || "bez zprávy"}`,
      `origin: ${location.origin}`,
      `href: ${location.href}`
    ].join("\n");
  }

  onAuthStateChanged(auth, (user) => {
    if (user) {
      show(`PŘIHLÁŠENÍ OK\nemail: ${user.email || "—"}\nuid: ${user.uid}\nprovider: ${user.providerData?.[0]?.providerId || "—"}`, "ok");
    } else {
      show(`Firebase Auth je inicializována.\nUživatel zatím není přihlášen.\norigin: ${location.origin}`, "warn");
    }
  });

  try {
    const result = await getRedirectResult(auth);
    if (result?.user) {
      show(`REDIRECT PŘIHLÁŠENÍ OK\nemail: ${result.user.email || "—"}\nuid: ${result.user.uid}`, "ok");
    }
  } catch (error) {
    show(`REDIRECT CHYBA\n${describeError(error)}`, "err");
  }

  document.getElementById("popupBtn").addEventListener("click", async () => {
    show("Otevírám Google přihlášení…", "warn");
    try {
      const result = await signInWithPopup(auth, provider);
      show(`POPUP PŘIHLÁŠENÍ OK\nemail: ${result.user.email || "—"}\nuid: ${result.user.uid}`, "ok");
    } catch (error) {
      show(`POPUP CHYBA\n${describeError(error)}`, "err");
    }
  });

  document.getElementById("redirectBtn").addEventListener("click", async () => {
    show("Přesměrovávám na Google…", "warn");
    try {
      await signInWithRedirect(auth, provider);
    } catch (error) {
      show(`REDIRECT CHYBA\n${describeError(error)}`, "err");
    }
  });

  document.getElementById("signOutBtn").addEventListener("click", async () => {
    try {
      await signOut(auth);
      show("Odhlášení OK. Firebase Auth zůstává funkční.", "ok");
    } catch (error) {
      show(`ODHLÁŠENÍ CHYBA\n${describeError(error)}`, "err");
    }
  });
</script>
</body>
</html>
